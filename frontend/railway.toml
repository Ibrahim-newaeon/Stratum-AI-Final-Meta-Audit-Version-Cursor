[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# nginx serves the built SPA and proxies /api and /ws to the backend service
# over Railway's private network (API_UPSTREAM, e.g. api.railway.internal:8000).
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
