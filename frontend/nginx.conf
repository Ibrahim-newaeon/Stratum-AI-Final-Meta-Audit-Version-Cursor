# Rendered from /etc/nginx/templates/default.conf.template by the nginx image's
# envsubst step. ${API_UPSTREAM} is the backend host:port — "api:8000" under
# docker compose. Listens on 8080 (non-root) and on IPv6 as well.
server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    # Re-resolve the backend on every request instead of once at startup: the
    # api container's private-network address changes on each deploy. The nginx
    # image exports NGINX_LOCAL_RESOLVERS from /etc/resolv.conf for templates.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=on;
    set $api_upstream http://${API_UPSTREAM};
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The payment permission is granted only to self and the Paddle checkout origins (Paddle.js overlay + sandbox)
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=(self "https://buy.paddle.com" "https://sandbox-buy.paddle.com")' always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Content Security Policy - adjust domains as needed for production
    # Measurement & Verification: GTM web container + GA4 collect endpoints (read-only measurement, not an ad platform)
    # Paddle Billing: Paddle.js v2 is served from https://cdn.paddle.com and the checkout overlay talks to /
    # frames https://*.paddle.com (the wildcard also covers the sandbox-* hosts). Keep this list identical to
    # backend/app/middleware/security.py build_csp and nginx/beta.conf.
    # "Log in with Facebook" (authentication, not an ad-platform integration): Meta's JS SDK needs
    # connect.facebook.net in script-src, the staticxx.facebook.com cross-domain iframe in frame-src,
    # and graph/www.facebook.com in connect-src. Omitting any one breaks the button with a console-only
    # error. The SDK is injected on demand, so a deployment with the feature off contacts none of them.
    # Google Fonts (fonts.googleapis.com / fonts.gstatic.com) are intentionally NOT allowed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://www.googletagmanager.com https://cdn.paddle.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https: blob: https://www.google-analytics.com https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.paddle.com https://*.sentry.io wss: ws: https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://graph.facebook.com https://www.facebook.com; frame-src 'self' https://*.paddle.com https://www.facebook.com https://staticxx.facebook.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # HSTS - Enable in production with proper SSL setup
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy (adjust for production)
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # WebSocket support
    location /ws/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Exact SPA liveness (container orchestration). Do not use a prefix match:
    # /health/api must reach the FastAPI JSON health payload.
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location = /health/api {
        access_log off;
        proxy_pass $api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
