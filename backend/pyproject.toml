# =============================================================================
# Stratum AI - Backend tool configuration
# =============================================================================
# There was no configuration file here, which made two of the three lint gates
# in .github/workflows/ci.yml unreliable rather than merely noisy.
#
# 1. `ruff>=0.2.0,<1.0.0` in requirements.txt is an unpinned major range, and
#    ruff's default rule set changed substantially across it. With no config,
#    the rules were whatever the version CI happened to install turned on by
#    default, so the same commit could report a different lint result weeks
#    apart with no code change. Fixed by pinning the tool versions in
#    requirements.txt - not by re-selecting rules here, which would change what
#    is enforced rather than just making it reproducible.
#
# 2. isort and black disagreed about how to wrap an import block, so
#    `isort --check-only .` failed on 195 files of which about 123 were the two
#    tools rewriting each other rather than anything a human did.
#    `profile = "black"` settles that and takes it to 72 real findings.
#
# Everything here is chosen to leave the current numbers alone except where the
# point is to improve them. Measured before and after:
#
#     ruff    4702 findings  ->  4702   (unchanged; defaults, now pinned)
#     isort   195 files      ->  72     (the conflict removed)
#     black   280 files      ->  280    (unchanged; 88 is already its default)
#
# Since then, [tool.ruff.lint.flake8-bugbear] below removed B008's 979 FastAPI
# false positives, so the ruff target is now:
#
#     ruff    4702 findings  ->  3723   (B008 dependency-injection noise gone)
#
# The remaining backlog is deliberately left alone. This file exists so it can
# be paid down against a fixed target instead of one that moves on upgrade.
# =============================================================================

[tool.ruff]
# Both of these are already ruff's defaults; recorded so they stay put, and so
# they visibly match [tool.black] below. Two formatters with different line
# lengths rewrite each other forever.
line-length = 88

[tool.ruff.lint.flake8-bugbear]
# B008 ("do not perform function call in argument defaults") fires 979 times,
# and every one of them is FastAPI's dependency-injection syntax, which
# REQUIRES the call to sit in the default:
#
#     async def endpoint(db: AsyncSession = Depends(get_async_session)): ...
#
# The rule exists to catch a mutable default evaluated once at import and then
# shared across calls. These are not that: FastAPI evaluates the marker at
# import to build the dependency graph, then resolves it per request. Rewriting
# them the way B008 suggests would break the framework.
#
# Listed by measurement, not by guesswork - these are exactly the four
# callables that trigger the rule today:
#
#     Depends         876
#     Query            91
#     require_tenant    8
#     File              4
#
# require_tenant is ours (defined in app/tenancy/deps.py): a factory that
# returns the validator, always written as Depends(require_tenant("tenant_id")),
# so the call being suppressed is the inner factory - same pattern, same safety.
# It is listed under app.tenancy because ruff matches the path the symbol is
# imported by, and every call site imports it from the package re-export
# (app/tenancy/__init__.py) rather than from .deps directly.
#
# This removes 979 false positives (4702 -> 3723). It does not suppress a
# single real finding: B008 stays on for every other callable, so an actual
# mutable default still fails.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "app.tenancy.require_tenant",
]

[tool.black]
line-length = 88

[tool.isort]
# The reason 123 of the 195 isort failures existed.
profile = "black"
line_length = 88
known_first_party = ["app"]

[tool.mypy]
# mypy only began checking anything once every package had an __init__.py;
# before that a duplicate module name aborted the run before the first file.
# The CI invocation passes --ignore-missing-imports on the command line, so it
# is recorded here as well rather than living only in a workflow argument.
#
# Deliberately not strict. There is a large existing backlog (1134 findings)
# and most of it is annotations mypy cannot narrow rather than defects - see
# the triage in the PR that fixed the one real crash it did surface. Turning
# strictness on here would bury that distinction, not resolve it.
ignore_missing_imports = true
