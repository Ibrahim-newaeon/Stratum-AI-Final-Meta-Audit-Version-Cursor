# =============================================================================
# Stratum AI - mypy configuration
# =============================================================================
# `app` is an implicit namespace package: there is no app/__init__.py, and
# several subpackages (app/api, app/autopilot, app/features, app/tasks, ...)
# omit it too. Without an explicit package base, mypy derives a module name by
# walking up only as far as the nearest directory that has an __init__.py, so
# both app/autopilot/service.py and app/features/service.py map to a bare
# module named "service". mypy then aborts with
#
#     app/features/service.py: error: Duplicate module named "service"
#
# before type checking a single file, which silently turned the CI type-check
# step into a no-op.
#
# Anchoring the package base at this directory makes those files resolve to
# app.autopilot.service and app.features.service, matching how the application
# actually imports them.
[mypy]
mypy_path = .
explicit_package_bases = True
namespace_packages = True
