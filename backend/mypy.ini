# =============================================================================
# Stratum AI - mypy configuration
# =============================================================================
# Every directory under `app/` is a regular package with an __init__.py, so a
# module's name follows from its path and nothing resolves ambiguously.
#
# It was not always so. `app` was an implicit namespace package and several
# subpackages omitted __init__.py, which meant mypy derived a module name by
# walking up only as far as the nearest directory that had one. Both
# app/autopilot/service.py and app/features/service.py therefore mapped to a
# bare module named "service", and mypy aborted with
#
#     app/features/service.py: error: Duplicate module named "service"
#
# before type checking a single file - silently turning the CI type-check step
# into a no-op. These settings anchor the package base here regardless, so the
# check keeps working if a namespace package is ever reintroduced.
[mypy]
mypy_path = .
explicit_package_bases = True
namespace_packages = True
