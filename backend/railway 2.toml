[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand on purpose: the image's docker-entrypoint.sh creates the schema,
# seeds demo data when SEED_DEMO=true, and serves via serve.py on a dual-stack
# socket (IPv4 for Railway's public proxy, IPv6 for its private network).
# The timeout covers first-boot schema creation and demo seeding.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
