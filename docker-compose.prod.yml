# =============================================================================
# Stratum AI - Production Docker Compose Override
# =============================================================================
# Self-hosted go-live stack for this repository. No Railway or Cloudflare.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL - Production settings (tuned per memory audit Feb 2026)
  # ===========================================================================
  db:
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-stratum_ai}
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=50
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G

  # ===========================================================================
  # Redis - Production settings (memory audit Feb 2026)
  # ===========================================================================
  redis:
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # FastAPI Backend - Production
  # ===========================================================================
  api:
    restart: always
    environment:
      - APP_ENV=production
      # Never inherit the base compose file's dev default: fabricated ad
      # metrics must never reach a real tenant, and the settings validator
      # refuses to start with this true while APP_ENV=production.
      - USE_MOCK_AD_DATA=false
      - SEED_DEMO=false
      - SERVICE_ROLE=api
      - AUTOPILOT_EXECUTION_ENABLED=false
      - AUTOPILOT_EXECUTION_DRY_RUN=true
      - RULES_LOCAL_CAMPAIGN_MUTATIONS_ENABLED=false
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stratum_ai}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stratum_ai}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY is required}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://app.yourdomain.com}
      - LOG_LEVEL=WARNING
      - LOG_FORMAT=json
      - SENTRY_DSN=${SENTRY_DSN:-}
      # Payments are off. Signup creates a free full-access workspace; do not
      # set BILLING_PAYMENTS_ENABLED=true or Paddle keys for this go-live.
      - BILLING_PAYMENTS_ENABLED=${BILLING_PAYMENTS_ENABLED:-false}
      - PADDLE_ENVIRONMENT=${PADDLE_ENVIRONMENT:-sandbox}
      - PADDLE_API_KEY=${PADDLE_API_KEY:-}
      - PADDLE_CLIENT_TOKEN=${PADDLE_CLIENT_TOKEN:-}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET:-}
      - PADDLE_STARTER_PRICE_ID=${PADDLE_STARTER_PRICE_ID:-}
      - PADDLE_PROFESSIONAL_PRICE_ID=${PADDLE_PROFESSIONAL_PRICE_ID:-}
      - PADDLE_ENTERPRISE_PRICE_ID=${PADDLE_ENTERPRISE_PRICE_ID:-}
    volumes:
      - ./backend/ml_models:/app/ml_models
    command: ["/app/docker-entrypoint.sh"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Celery Worker - Production
  # ===========================================================================
  worker:
    restart: always
    environment:
      - APP_ENV=production
      # Never inherit the base compose file's dev default: fabricated ad
      # metrics must never reach a real tenant, and the settings validator
      # refuses to start with this true while APP_ENV=production.
      - USE_MOCK_AD_DATA=false
      - AUTOPILOT_EXECUTION_ENABLED=false
      - AUTOPILOT_EXECUTION_DRY_RUN=true
      - RULES_LOCAL_CAMPAIGN_MUTATIONS_ENABLED=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stratum_ai}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stratum_ai}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/2
      - LOG_LEVEL=WARNING
      - SENTRY_DSN=${SENTRY_DSN:-}
      # Payments off for this portal.
      - BILLING_PAYMENTS_ENABLED=${BILLING_PAYMENTS_ENABLED:-false}
      - PADDLE_ENVIRONMENT=${PADDLE_ENVIRONMENT:-sandbox}
      - PADDLE_API_KEY=${PADDLE_API_KEY:-}
      - PADDLE_CLIENT_TOKEN=${PADDLE_CLIENT_TOKEN:-}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET:-}
      - PADDLE_STARTER_PRICE_ID=${PADDLE_STARTER_PRICE_ID:-}
      - PADDLE_PROFESSIONAL_PRICE_ID=${PADDLE_PROFESSIONAL_PRICE_ID:-}
      - PADDLE_ENTERPRISE_PRICE_ID=${PADDLE_ENTERPRISE_PRICE_ID:-}
    volumes:
      - ./backend/ml_models:/app/ml_models
    # -Q must list every queue in celery_app.TASK_ROUTES/BEAT_SCHEDULE
    # (app.workers.celery_app.CELERY_QUEUES); without it the worker drains
    # only Celery's built-in "celery" queue and nothing scheduled runs.
    command: celery -A app.workers.celery_app worker -Q cdp,celery,default,intel,ml,rules,sync --loglevel=warning --concurrency=2
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Celery Beat - Production (memory audit Feb 2026)
  # ===========================================================================
  scheduler:
    restart: always
    environment:
      - APP_ENV=production
      # Never inherit the base compose file's dev default: fabricated ad
      # metrics must never reach a real tenant, and the settings validator
      # refuses to start with this true while APP_ENV=production.
      - USE_MOCK_AD_DATA=false
      - AUTOPILOT_EXECUTION_ENABLED=false
      - AUTOPILOT_EXECUTION_DRY_RUN=true
      - RULES_LOCAL_CAMPAIGN_MUTATIONS_ENABLED=false
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stratum_ai}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/2
    volumes: []
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('celerybeat-schedule') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # React Frontend - Production (Nginx)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: always
    environment:
      - NODE_ENV=production
    volumes: []
    ports:
      - "80:8080"
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M

  # ===========================================================================
  # PgBouncer - Connection Pooling (memory audit Feb 2026)
  # ===========================================================================
  pgbouncer:
    image: edoburu/pgbouncer:1.22
    container_name: stratum_pgbouncer
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stratum_ai}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
    ports:
      - "6432:6432"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Flower - Disabled in production by default
  # ===========================================================================
  flower:
    profiles:
      - monitoring
