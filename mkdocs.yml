site_name: Stratum AI Docs
site_description: Revenue Operating System for Facebook, Instagram and WhatsApp with Trust-Gated Autopilot
site_url: https://ibrahim-newaeon.github.io/Stratum-AI-Final-Meta/
repo_url: https://github.com/Ibrahim-newaeon/Stratum-AI-Final-Meta
repo_name: Stratum-AI-Final-Meta
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Overview: index.md
  - Architecture:
      - Trust Engine: architecture/trust-engine.md
  - Backend:
      - Backend overview: 02-backend/backend-overview.md
  - Integrations:
      - Overview: integrations/README.md
      - Billing (Paddle): integrations/billing-paddle.md
  - Operations:
      - Runbooks: 05-operations/runbooks.md
  - Audit:
      - Integration audit: STRATUM_INTEGRATION_AUDIT.md
